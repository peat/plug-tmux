# deck.conf: the talk's tmux server. Raw tmux defaults everywhere else; this only styles the deck.
set -g base-index 1
set -g history-limit 20000
set -g window-size latest           # slides fit the presenter's terminal; watchers use ignore-size
set -g allow-rename off
set -g automatic-rename off
set -g default-terminal tmux-256color

# --- status bar: talk name on the left, slide title centered, position and Pacific time on the right
set -g status-style 'bg=colour24,fg=colour255'
set -g status-left '#[bold] tmux @ PLUG '
set -g status-left-length 50
set -g status-justify centre
set -g window-status-format ''
set -g window-status-current-format '#[bold]#W'
# Presenter's size check: ↑ = too wide (bigger font), ↓ = too narrow (smaller font), · = just right.
# Read-only clients (watchers) always get a plain ·
set -g @target_width 92
set -g status-right '#I/#{session_windows} #{?client_readonly,·,#{?#{e|>:#{client_width},#{@target_width}},↑,#{?#{e|<:#{client_width},#{@target_width}},↓,·}}} #(TZ=America/Los_Angeles date +%%H:%%M) '   # the server keeps the TZ it started with
set -g status-right-length 60

# --- demo mode: the outer deck goes quiet so C-b reaches a tmux running inside a pane.
# Enter: C-b e. Leave: C-] (telnet's escape key). The status bar goes grey while it's on.
bind e {
  set prefix None
  set key-table off
  set status-style 'bg=colour238,fg=colour250'
  set status-left '#[bold] DEMO MODE: C-] to return to slides '
}
bind -T off C-] {
  set -u prefix
  set -u key-table
  set -u status-style
  set -u status-left
}
bind B run-shell -b "~/deck/deck rebuild"   # C-b B: rebuild from talk.txt
